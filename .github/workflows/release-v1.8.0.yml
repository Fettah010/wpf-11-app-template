name: Scheduled v1.8.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v1.8.0.yml"
      - ".template.config/**"
      - "CHANGELOG.md"
      - "DevTemWpf.slnx"
      - "Directory.*"
      - "README.md"
      - "docs/decisions/ADR-0003-package-boundaries.md"
      - "docs/decisions/ADR-0020-ui-resource-package-boundary.md"
      - "docs/releases/1.8.0-*"
      - "docs/TESTING.md"
      - "docs/template/**"
      - "eng/**"
      - "src/**"
      - "templates/**"
      - "tests/**"
  schedule:
    - cron: "50 23 29 10 *"
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "For manual recovery only, enter RELEASE v1.8.0"
        required: true
        type: string

concurrency:
  group: release-v1.8.0
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'schedule' || startsWith(github.run_started_at, '2026-10-29')
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      release_sha: ${{ steps.select-pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select and check out the pinned release commit
        id: select-pin
        shell: pwsh
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          $ErrorActionPreference = "Stop"
          $candidateTag = "v1.8.0-candidate"

          if ($env:GITHUB_EVENT_NAME -eq "schedule" -and
              (Get-Date -AsUTC -Format "yyyy-MM-dd") -ne "2026-10-29") {
            throw "Scheduled release is valid only on 2026-10-29 UTC."
          }
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and
              $env:CONFIRM_RELEASE -cne "RELEASE v1.8.0") {
            throw "Manual recovery requires the exact confirmation: RELEASE v1.8.0"
          }

          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $remoteTag = git ls-remote --tags origin "refs/tags/$candidateTag"
            if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the candidate tag." }
            if ($remoteTag) {
              git fetch origin "refs/tags/${candidateTag}:refs/tags/${candidateTag}"
              if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the existing candidate tag." }
              $sha = (git rev-parse "$candidateTag^{commit}").Trim()
            }
            else {
              $sha = $env:GITHUB_SHA
            }
          }
          else {
            git fetch origin "refs/tags/${candidateTag}:refs/tags/${candidateTag}"
            if ($LASTEXITCODE -ne 0) {
              throw "No verified candidate tag exists; the release must not be published."
            }
            $sha = (git rev-parse "$candidateTag^{commit}").Trim()
          }

          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Release pin is not a full commit SHA." }
          git checkout --detach $sha
          if ($LASTEXITCODE -ne 0 -or (git rev-parse HEAD).Trim() -ne $sha) {
            throw "Could not check out the exact pinned release commit $sha."
          }

          "sha=$sha" >> $env:GITHUB_OUTPUT
          "Release commit: ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - name: Validate release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Select-String -Path "templates/pack/DevTemWPF.Templates.csproj" -Pattern '<Version>1\.8\.0</Version>')) {
            throw "Template package version must be 1.8.0."
          }
          if (-not (Select-String -Path "CHANGELOG.md" -Pattern '^## 1\.8\.0\b')) {
            throw "CHANGELOG.md must contain the 1.8.0 release entry."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-release-${{ hashFiles('Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-release-

      - name: Verify pinned SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build (Release, zero warnings)
        run: dotnet build -c Release --no-restore --warnaserror

      - name: Test full solution
        run: dotnet test -c Release --no-build

      - name: Required UI automation (zero skips)
        run: powershell -ExecutionPolicy Bypass -File eng/check-ui-tests.ps1
        timeout-minutes: 15

      - name: Generator gate (source)
        run: powershell -ExecutionPolicy Bypass -File eng/test-generators.ps1
        timeout-minutes: 20

      - name: UI resource package canary
        run: powershell -ExecutionPolicy Bypass -File eng/test-ui-package.ps1
        timeout-minutes: 10

      - name: Full template matrix (source)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1
        timeout-minutes: 60

      - name: Pack template package
        run: dotnet pack templates/pack/DevTemWPF.Templates.csproj -c Release -o artifacts/packages

      - name: Generator gate (packed template)
        shell: pwsh
        run: |
          $package = Get-ChildItem "artifacts/packages/DevTemWPF.Templates.1.8.0.nupkg"
          powershell -ExecutionPolicy Bypass -File eng/test-generators.ps1 -PackagePath $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "Packed generator gate failed." }
        timeout-minutes: 20

      - name: Full template matrix (packed template)
        shell: pwsh
        run: |
          $package = Get-ChildItem "artifacts/packages/DevTemWPF.Templates.1.8.0.nupkg"
          powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1 -PackagePath $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "Packed template matrix failed." }
        timeout-minutes: 60

      - name: Audit package vulnerabilities and deprecations
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-CleanPackageAudit([string]$kind, [string]$label) {
            $flag = "--$kind"
            $jsonOutput = dotnet list DevTemWpf.slnx package $flag --include-transitive --format json
            if ($LASTEXITCODE -ne 0) { throw "$label audit command failed." }
            $projectCount = (($jsonOutput -join "`n") | ConvertFrom-Json).projects.Count
            if ($projectCount -lt 1) { throw "$label audit found no projects to inspect." }

            $output = dotnet list DevTemWpf.slnx package $flag --include-transitive 2>&1
            if ($LASTEXITCODE -ne 0) { throw "$label audit command failed." }
            $text = $output -join "`n"
            $output | ForEach-Object { Write-Host $_ }
            if ($text -match '(?i)\bNU1900\b') {
              throw "$label audit could not reliably retrieve advisory metadata."
            }

            $projectStatuses = @($text -split "`r?`n" | Where-Object { $_ -match '^\s*The given project ' })
            if ($projectStatuses.Count -ne $projectCount) {
              throw "$label audit returned $($projectStatuses.Count) project results; expected $projectCount."
            }
            if ($text -match "(?i)has the following $kind packages") {
              throw "$label package findings detected."
            }
            if ($text -notmatch "(?i)has no $kind packages") {
              throw "$label audit did not confirm a clean result."
            }
          }

          Assert-CleanPackageAudit "vulnerable" "Vulnerability"
          Assert-CleanPackageAudit "deprecated" "Deprecation"

      - name: Prepare release package and checksum
        id: artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Get-Item "artifacts/packages/DevTemWPF.Templates.1.8.0.nupkg"
          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($package.FullName).sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($package.Name)" -NoNewline -Encoding ascii

          $changelog = Get-Content "CHANGELOG.md" -Raw
          $section = [regex]::Match($changelog, '(?ms)^## 1\.8\.0\b.*?(?=^## 1\.7\.0\b|\z)')
          if (-not $section.Success) { throw "Unable to extract the 1.8.0 changelog entry." }
          $notes = @"
          $($section.Value.Trim())

          Release commit: ${{ steps.select-pin.outputs.sha }}
          Verification workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Template package SHA-256: $hash
          "@
          $notesPath = "artifacts/packages/release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8NoBOM

          "package_name=$($package.Name)" >> $env:GITHUB_OUTPUT
          "package_sha256=$hash" >> $env:GITHUB_OUTPUT
          "checksum_name=$([System.IO.Path]::GetFileName($checksumPath))" >> $env:GITHUB_OUTPUT

      - name: Upload verified release inputs
        uses: actions/upload-artifact@v4
        with:
          name: v1.8.0-release-inputs
          path: |
            artifacts/packages/DevTemWPF.Templates.1.8.0.nupkg
            artifacts/packages/DevTemWPF.Templates.1.8.0.nupkg.sha256
            artifacts/packages/release-notes.md
          if-no-files-found: error
          retention-days: 7

  pin-candidate:
    if: github.event_name == 'push'
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_sha }}
          fetch-depth: 0

      - name: Pin verified candidate commit
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v1.8.0-candidate"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect the candidate tag." }

          if ($remoteTag) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) { throw "Unable to fetch the existing candidate tag." }
            $existingSha = (git rev-parse "$tag^{commit}").Trim()
            if ($existingSha -cne $env:RELEASE_SHA) {
              throw "Candidate tag already pins a different commit; refusing to move it."
            }
            Write-Host "Candidate tag already pins $existingSha."
          }
          else {
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a $tag $env:RELEASE_SHA -m "Verified v1.8.0 release candidate"
            if ($LASTEXITCODE -ne 0) { throw "Unable to create the candidate tag." }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Unable to push the candidate tag." }
            Write-Host "Pinned candidate $tag at $env:RELEASE_SHA."
          }

  publish:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release inputs
        uses: actions/download-artifact@v4
        with:
          name: v1.8.0-release-inputs
          path: artifacts/packages

      - name: Publish v1.8.0 release idempotently
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
          PACKAGE_NAME: DevTemWPF.Templates.1.8.0.nupkg
          CHECKSUM_NAME: DevTemWPF.Templates.1.8.0.nupkg.sha256
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $packagePath = "artifacts/packages/$env:PACKAGE_NAME"
          $checksumPath = "artifacts/packages/$env:CHECKSUM_NAME"
          $notesPath = "artifacts/packages/release-notes.md"
          foreach ($path in @($packagePath, $checksumPath, $notesPath)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing verified release input: $path" }
          }

          $actualHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          if ($checksumLine -cne "$actualHash  $env:PACKAGE_NAME") {
            throw "Release package checksum does not match the verified package."
          }

          $existingTag = gh api "repos/$env:REPOSITORY/commits/v1.8.0" --jq .sha 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists -and $existingTag.Trim() -cne $env:RELEASE_SHA) {
            throw "The v1.8.0 tag points to a different commit; refusing to overwrite it."
          }

          $releaseJson = gh release view v1.8.0 --json isDraft,assets,tagName,url 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.tagName -cne "v1.8.0" -or -not $tagExists) {
              throw "Existing v1.8.0 release has inconsistent tag state."
            }
          }
          else {
            if ($tagExists) {
              gh release create v1.8.0 $packagePath $checksumPath --verify-tag --draft --title "v1.8.0 - Architecture preparation" --notes-file $notesPath
            }
            else {
              gh release create v1.8.0 $packagePath $checksumPath --target $env:RELEASE_SHA --draft --title "v1.8.0 - Architecture preparation" --notes-file $notesPath
            }
            if ($LASTEXITCODE -ne 0) { throw "Unable to create the v1.8.0 draft release." }
            $releaseJson = gh release view v1.8.0 --json isDraft,assets,tagName,url
            if ($LASTEXITCODE -ne 0) { throw "Unable to verify the created v1.8.0 draft release." }
            $release = $releaseJson | ConvertFrom-Json
          }

          $requiredAssets = @($env:PACKAGE_NAME, $env:CHECKSUM_NAME)
          $assetNames = @($release.assets | ForEach-Object { $_.name })
          if ($release.isDraft) {
            $missing = @($requiredAssets | Where-Object { $_ -notin $assetNames })
            if ($missing.Count -gt 0) {
              $uploadArgs = @("release", "upload", "v1.8.0")
              if ($env:PACKAGE_NAME -in $missing) { $uploadArgs += $packagePath }
              if ($env:CHECKSUM_NAME -in $missing) { $uploadArgs += $checksumPath }
              gh @uploadArgs
              if ($LASTEXITCODE -ne 0) { throw "Unable to attach release assets." }
            }
          }
          elseif (@($requiredAssets | Where-Object { $_ -notin $assetNames }).Count -gt 0) {
            throw "Published v1.8.0 release is missing a required asset."
          }

          $verifyDir = "artifacts/existing-release"
          New-Item -ItemType Directory -Path $verifyDir -Force | Out-Null
          gh release download v1.8.0 --pattern $env:PACKAGE_NAME --dir $verifyDir
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify the published template package." }
          $publishedPackage = Get-Item (Join-Path $verifyDir $env:PACKAGE_NAME)
          $publishedHash = (Get-FileHash -LiteralPath $publishedPackage.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publishedHash -cne $actualHash) { throw "Existing release package hash does not match the verified build." }

          $checksumDir = "artifacts/existing-checksum"
          New-Item -ItemType Directory -Path $checksumDir -Force | Out-Null
          gh release download v1.8.0 --pattern $env:CHECKSUM_NAME --dir $checksumDir
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify the published checksum." }
          $publishedChecksum = (Get-Content (Join-Path $checksumDir $env:CHECKSUM_NAME) -Raw).Trim()
          if ($publishedChecksum -cne $checksumLine) { throw "Existing release checksum does not match the verified build." }

          if ($release.isDraft) {
            gh release edit v1.8.0 --draft=false
            if ($LASTEXITCODE -ne 0) { throw "Unable to publish the verified v1.8.0 release." }
          }
          $url = gh release view v1.8.0 --json url --jq .url
          if ($LASTEXITCODE -ne 0) { throw "Unable to confirm the published release URL." }
          $summary = @"
          ## v1.8.0 release

          - Commit: ``$env:RELEASE_SHA``
          - Release: $url
          - Template package SHA-256: ``$actualHash``
          - All required release gates passed on the pinned candidate.
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY
