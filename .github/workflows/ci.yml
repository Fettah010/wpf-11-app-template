name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pinned SDK check
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build (Release, zero warnings)
        run: dotnet build -c Release --no-restore --warnaserror

      - name: Test
        run: dotnet test -c Release --no-build

      - name: List packages (audit trail)
        run: dotnet list package --include-transitive

      - name: Template gate (Clean preset)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1 -Presets Clean
        timeout-minutes: 20
