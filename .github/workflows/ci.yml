name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pinned SDK check
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build (Release, zero warnings)
        run: dotnet build -c Release --no-restore --warnaserror

      - name: Test
        run: dotnet test -c Release --no-build

      - name: UI gate (required cases must execute, skips fail)
        run: powershell -ExecutionPolicy Bypass -File eng/check-ui-tests.ps1
        timeout-minutes: 15

      - name: List packages (audit trail)
        run: dotnet list package --include-transitive

  template-matrix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Full preset matrix (source folder)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1
        timeout-minutes: 120

  template-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack template package
        run: dotnet pack templates/pack/DevTemWPF.Templates.csproj -c Release -o artifacts/packages

      - name: Full preset matrix (packed .nupkg)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1 -PackagePath (Get-ChildItem artifacts/packages/*.nupkg | Select-Object -First 1 -ExpandProperty FullName)
        timeout-minutes: 120
