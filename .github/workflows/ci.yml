name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

# A new push supersedes previous runs on the same ref: cancel them so slow
# template matrices never stack up and burn runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      - name: Pinned SDK check
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build (Release, zero warnings)
        run: dotnet build -c Release --no-restore --warnaserror

      - name: Test
        run: dotnet test -c Release --no-build

      - name: UI gate (required cases must execute, skips fail)
        run: powershell -ExecutionPolicy Bypass -File eng/check-ui-tests.ps1
        timeout-minutes: 15

      - name: List packages (audit trail)
        run: dotnet list package --include-transitive

  # Template gates split into parallel jobs (1.4.0): presets vs shells,
  # source vs packed package. Wall time ~= slowest shard (~100 min) instead
  # of the ~2.5 h sequential full matrix. The union of shards is the full
  # gate defined in eng/test-templates.ps1 (defaults run everything).
  template-matrix-presets:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      - name: Preset matrix (source folder)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1 -Shells Sidebar
        timeout-minutes: 180

  template-matrix-shells:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      - name: Shell matrix (source folder)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1 -NoPresets
        timeout-minutes: 180

  template-package-presets:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      - name: Pack template package
        run: dotnet pack templates/pack/DevTemWPF.Templates.csproj -c Release -o artifacts/packages

      - name: Preset matrix (packed .nupkg)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1 -PackagePath (Get-ChildItem artifacts/packages/*.nupkg | Select-Object -First 1 -ExpandProperty FullName) -Shells Sidebar
        timeout-minutes: 180

  template-package-shells:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x


      - name: Pack template package
        run: dotnet pack templates/pack/DevTemWPF.Templates.csproj -c Release -o artifacts/packages

      - name: Shell matrix (packed .nupkg)
        run: powershell -ExecutionPolicy Bypass -File eng/test-templates.ps1 -PackagePath (Get-ChildItem artifacts/packages/*.nupkg | Select-Object -First 1 -ExpandProperty FullName) -NoPresets
        timeout-minutes: 180
